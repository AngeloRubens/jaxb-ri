#
# Fork-only workflow: JMH A/B measurement of jaxb-ri branches against a baseline, with
# Jackson XML as an external reference, in a single JMH invocation (same runner, same JVM
# binary, same fixtures). The functional test suite of each branch runs in the "JAXB RI"
# workflow (maven.yml).
#
name: Performance A/B

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Space-separated branches to measure (e.g. "perf/a perf/b")'
        required: true
      baseline:
        description: 'Baseline ref; empty = merge-base of the first branch with eclipse-ee4j master'
        required: false
        default: ''
      fixtures:
        description: 'Comma-separated fixtures'
        required: false
        default: 'catalog4,catalog32,catalog256,rows32,nsrows32'
      ops:
        description: 'unmarshal,marshal'
        required: false
        default: 'unmarshal,marshal'
      parser:
        description: 'JAXB unmarshal input: sax (InputStream, JAXP SAX) and/or stax (Woodstox XMLStreamReader)'
        required: false
        default: 'sax'
      forks:
        description: 'JMH forks per configuration'
        required: false
        default: '2'
      jdk:
        description: 'JDK used to run the benchmark'
        required: false
        default: '25'

jobs:
  bench:
    name: JMH ${{ inputs.branches }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: src

      - name: Set up build JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set up benchmark JDK
        id: benchjdk
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.jdk }}

      - name: Build variants
        working-directory: src
        env:
          BRANCHES: ${{ inputs.branches }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          git remote add upstream https://github.com/eclipse-ee4j/jaxb-ri.git
          git fetch -q upstream master
          first=${BRANCHES%% *}
          git fetch -q origin "$first"
          if [ -z "$BASELINE" ]; then BASELINE=$(git merge-base "origin/$first" upstream/master); fi
          echo "BASELINE_SHA=$BASELINE" >> $GITHUB_ENV
          V=$GITHUB_WORKSPACE/variants
          perf-bench/build-variant.sh "$BASELINE" baseline "$V"
          IMPLS=baseline
          for b in $BRANCHES; do
            git fetch -q origin "$b"
            name=${b#perf/}; name=${name//\//_}
            perf-bench/build-variant.sh "origin/$b" "$name" "$V"
            IMPLS="$IMPLS,$name"
          done
          echo "IMPLS=$IMPLS,jackson" >> $GITHUB_ENV

      - name: Build harness
        working-directory: src/perf-bench
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          mvn -B -q package dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Run JMH
        working-directory: src/perf-bench
        env:
          JAVA_BENCH: ${{ steps.benchjdk.outputs.path }}/bin/java
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          {
            echo "runner: $(nproc) CPUs, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
            echo "memory: $(free -m | awk '/Mem/ {print $2}') MiB"
            echo "loadavg before: $(cat /proc/loadavg)"
            "$JAVA_BENCH" -version 2>&1
            echo "baseline: $BASELINE_SHA"
            cat $GITHUB_WORKSPACE/variants/*/COMMIT
          } | tee $GITHUB_WORKSPACE/out/environment.txt
          "$JAVA_BENCH" -cp "target/jaxb-ri-bench-1.0.jar:$(cat cp.txt)" org.openjdk.jmh.Main 'bench.BindingBenchmark.bind' \
            -p impl=$IMPLS -p fixture=${{ inputs.fixtures }} -p op=${{ inputs.ops }} -p parser=${{ inputs.parser }} \
            -f ${{ inputs.forks }} -wi 5 -i 8 -w 1s -r 1s -prof gc -foe true \
            -jvmArgsAppend "-XX:+UseG1GC -XX:ActiveProcessorCount=2 -Xms1g -Xmx1g -Dbench.variants=$GITHUB_WORKSPACE/variants" \
            -rf json -rff $GITHUB_WORKSPACE/out/results.json | tee $GITHUB_WORKSPACE/out/jmh.txt
          echo "loadavg after: $(cat /proc/loadavg)" | tee -a $GITHUB_WORKSPACE/out/environment.txt

      - name: Report
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/out
          {
            echo "## Performance A/B: ${{ inputs.branches }}"
            echo '```'; cat environment.txt; echo '```'
            python3 $GITHUB_WORKSPACE/src/perf-bench/report.py results.json baseline
          } > report.md
          cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-${{ github.run_id }}
          path: out/
